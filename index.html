<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>재개발 위클리</title>
<meta name="description" content="이번 주 재개발 톡방 요약 · 주요 이슈, 추천 구역, 리트리 픽, 장미마을">
<meta property="og:type" content="website">
<meta property="og:title" content="재개발 위클리">
<meta property="og:description" content="이번 주 재개발 톡방 요약 · 주요 이슈, 추천 구역, 리트리 픽, 장미마을">
<meta property="og:url" content="https://modusik0825-stack.github.io/redevelopment/">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!-- 업데이트.bat(update.ps1)이 만드는 이번 주 데이터 -->
<script src="weekly.js"></script>
<!-- 업데이트할 때 Claude가 써 넣는 요약 문장 (없으면 자동 문구) -->
<script src="notes.js"></script>
<style>
:root{
  --bg:#ffffff; --ink:#111111; --body:#555555; --muted:#999999; --line:#e9e9e9; --block:#eeeeee;
  --dot:#ff6b2c; --up:#e5483d; --down:#3b6fe0;
}
*{box-sizing:border-box}
body{margin:0;background:#f4f4f4;color:var(--ink);font:16px/1.65 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
/* 항상 모바일 화면 */
.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg)}
.wrap{padding:0 20px}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}

/* 헤더 */
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.mast{display:flex;align-items:center;justify-content:center;height:58px}
.logo{font-weight:900;font-size:22px;letter-spacing:-.05em}
.tabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;padding:0 20px}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;font-size:16px;font-weight:600;padding:8px 0 12px;position:relative}
.tabs a.on{box-shadow:inset 0 -2px 0 var(--ink)}
.dot::after{content:"";position:absolute;top:6px;right:-7px;width:5px;height:5px;border-radius:50%;background:var(--dot)}

/* 주차 배너 */
.banner{background:var(--block);margin:16px 0 0;border-radius:6px;padding:12px 16px}
.banner h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.04em}
.banner p{margin:2px 0 0;font-size:13px;color:var(--body);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--body)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--dot)}

/* 이번 주 한 줄 */
.headline{padding:26px 0 6px}
.headline h2{font-size:20px;font-weight:700;line-height:1.45;margin:0 0 6px;letter-spacing:-.03em}
.headline p{margin:0;color:var(--body);font-size:15px}
.why{list-style:none;padding:0;margin:14px 0 0;border-top:1px solid var(--line)}
.why li{padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;color:var(--body);display:grid;grid-template-columns:76px 1fr;gap:8px}
.why li b{color:var(--ink);font-weight:700;font-size:14px;word-break:keep-all}
.more{display:inline-block;margin-top:12px;font-size:14px;font-weight:600;background:none;border:0;padding:0;cursor:pointer}
.sub-more{color:var(--muted);font-weight:500;margin-top:6px}

/* 섹션 */
section{padding:34px 0 6px;scroll-margin-top:110px}
.sh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:4px}
.sh h2{font-size:21px;font-weight:800;margin:0;letter-spacing:-.04em}
.sh small{font-size:13px;color:var(--muted)}
.meta{font-size:13px;color:var(--muted);margin-top:8px}
.meta b{color:var(--ink);font-weight:600;margin-right:6px}
.sub{font-size:16px;font-weight:700;margin:28px 0 4px}
.basis{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.6}
.empty{font-size:14px;color:var(--muted);padding:16px 0}
.post{padding:20px 0;border-bottom:1px solid var(--line)}
.post p{margin:0;font-size:15px;color:var(--body)}
.talk{margin:0;padding-left:18px;font-size:15px;color:var(--body)}
.talk li{margin:0 0 6px;padding-left:2px}
.talk li::marker{color:var(--muted)}

/* 슬라이드 카드 */
.slider{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:16px -20px 0;padding:0 20px 4px;scrollbar-width:none;scroll-padding:0 20px}
.slider::-webkit-scrollbar{display:none}
.card{flex:0 0 82%;scroll-snap-align:start;text-align:left;background:var(--bg);border:1px solid #dddddd;border-radius:10px;padding:18px 16px 16px;cursor:pointer;display:flex;flex-direction:column;min-height:210px}
.card:hover{border-color:var(--ink)}
.card .cat{font-size:13px;font-weight:600;color:var(--body)}
.card h3{font-size:18px;font-weight:700;line-height:1.42;margin:10px 0 8px;letter-spacing:-.03em}
.card p{margin:0;font-size:14px;color:var(--body);flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .foot{font-size:13px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.card .foot em{font-style:normal}
.up{color:var(--up)} .down{color:var(--down)}
.zcard{flex-basis:66%;min-height:0}
.zhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.zhead b{font-size:18px;font-weight:800;letter-spacing:-.03em}
.zx{font-size:12px;font-weight:600;color:var(--up);white-space:nowrap}
.zx.new{color:var(--dot)}
.zcard p{margin-top:8px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:14px}
.dots i{width:6px;height:6px;border-radius:50%;background:#d6d6d6}
.dots i.on{background:var(--ink);width:16px;border-radius:3px}

/* 추천 순위 */
.r{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);cursor:pointer}
.r .no{font-size:18px;font-weight:800;text-align:center}
.r .zn{font-size:17px;font-weight:700;position:relative}
.r .zn.dot::after{top:2px;right:-8px}
.r .m{display:block;font-size:13px;color:var(--muted)}
.r .mv{font-size:13px;font-weight:600;text-align:right;min-width:48px;color:var(--muted)}
.r .mv.new{color:var(--dot)}
.r .mv.up{color:var(--up)} .r .mv.down{color:var(--down)}
.r .rt{font-size:12px;font-weight:600;background:var(--block);border-radius:4px;padding:1px 6px;margin-left:10px;vertical-align:2px}
.r:hover .zn{text-decoration:underline}

/* 리트리 */
.seg{display:flex;gap:6px;margin:14px 0 2px}
.seg button{font-size:14px;font-weight:600;border:1px solid #dcdcdc;background:var(--bg);color:var(--body);border-radius:999px;padding:5px 14px;cursor:pointer}
.seg button em{font-style:normal;color:var(--muted);font-weight:500;margin-left:3px}
.seg button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.seg button.on em{color:#cfcfcf}
.pick{padding:20px 0;border-bottom:1px solid var(--line)}
.pick h3{font-size:18px;font-weight:700;margin:0 0 6px;letter-spacing:-.03em}
.pick p{margin:0;font-size:15px;color:var(--body)}
.wk-tag{font-size:12px;font-weight:600;color:var(--dot);margin-left:6px;vertical-align:2px}

/* 장미마을 */
.rose-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 4px}
.rose-stat div{background:var(--block);border-radius:6px;padding:12px 10px;text-align:center}
.rose-stat b{display:block;font-size:20px;font-weight:800}
.rose-stat span{font-size:12px;color:var(--body)}

/* 관련 대화 시트 */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:430px;max-height:82vh;background:var(--bg);border-radius:16px 16px 0 0;transform:translate(-50%,100%);transition:transform .25s ease;z-index:21;display:flex;flex-direction:column}
.sheet.open{transform:translate(-50%,0)}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:#d6d6d6;margin:10px auto 0}
.sheet .sh-head{padding:14px 20px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet .sh-head .cat{font-size:13px;color:var(--body);font-weight:600}
.sheet .sh-head h3{margin:4px 0 0;font-size:18px;line-height:1.4;letter-spacing:-.03em}
.sheet .x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px}
.sheet .sh-body{overflow-y:auto;padding:8px 20px 28px}
.sheet .count{font-size:13px;color:var(--muted);padding:12px 0 2px}
.chat{padding:12px 0;border-bottom:1px solid var(--line)}
.chat .who{font-size:13px;color:var(--muted)}
.chat .who b{color:var(--ink);font-weight:600;margin-right:6px}
.chat p{margin:4px 0 0;font-size:15px;color:#333;word-break:break-word}
.chat.ctx{padding-left:14px;border-left:2px solid var(--line);margin-left:2px}
.chat.ctx p{color:var(--body);font-size:14px}
.chat .lbl{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px}
mark{background:none;color:var(--ink);font-weight:700;box-shadow:inset 0 -6px 0 #ffe3d4}

footer{border-top:1px solid var(--line);margin-top:40px;padding:24px 20px 50px;font-size:13px;color:var(--muted);line-height:1.8}
footer b{display:block;color:var(--ink);font-size:16px;font-weight:900;letter-spacing:-.04em;margin-bottom:6px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="wrap mast"><div class="logo">재개발 위클리</div></div>
  <nav class="tabs" id="tabs">
    <a href="#issue" class="on">주요 이슈</a>
    <a href="#pick">추천 구역</a>
    <a href="#retree">리트리 픽</a>
    <a href="#rose">장미마을</a>
  </nav>
</header>
<main class="wrap" id="main"></main>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sh-head"><div><div class="cat" id="shCat"></div><h3 id="shTitle"></h3></div><button class="x" id="shClose" aria-label="닫기">×</button></div>
  <div class="sh-body" id="shBody"></div>
</div>

<footer>
  <b>재개발 위클리</b>
  단톡방 대화에서 “구역명+번호”와 추천 표현을 자동으로 찾아 정리해요. 잘못 잡힌 구역이 있을 수 있으니 구역을 눌러 원문을 확인해 주세요.
  <div id="built"></div>
</footer>
</div>

<script>
(() => {
  const W = window.WEEKLY;
  const N0 = window.WEEKLY_NOTES;
  const N = (N0 && W && N0.week === W.weekStart) ? N0 : {};   // 이번 주 메모만 사용
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const main = $('#main');
  if (!W) { main.innerHTML = '<p class="empty">아직 데이터가 없어요. 재개발 폴더의 업데이트.bat을 실행해 주세요.</p>'; return; }

  /* ---------- 대화 시트 ---------- */
  const SHEETS = [];   // 카드마다 { cat, title, rows, label, hl }
  const reg = d => (SHEETS.push(d), SHEETS.length - 1);
  const zoneRe = z => { const m = /^(.+?)(\d.*)$/.exec(z); return m ? new RegExp('(' + m[1] + '\\s?동?\\s?(?:제\\s?)?' + m[2].replace('-', '\\-') + '[aAbB]?(?:구역)?)', 'g') : null; };
  const ROSE_RE = /((?:신길\s?|도림\s?|영등포\s?)?장미(?:마을)?)/g;
  const sheet = $('#sheet'), bg = $('#sheetBg');
  function openSheet(id) {
    const d = SHEETS[id], rows = d.rows || [];
    const kw = rows.filter(r => r[3] === 'k').length, cx = rows.length - kw;
    $('#shCat').textContent = d.cat; $('#shTitle').textContent = d.title;
    const label = d.label ? `${d.label} 언급 ${kw}개 · 이어진 대화 ${cx}개 · 시간 순` : `관련 대화 ${rows.length}개 · 시간 순`;
    $('#shBody').innerHTML = `<div class="count">${esc(label)}</div>` + (rows.length ? rows.map(([who, t, x, k]) => {
      let tx = esc(x); if (d.hl && k === 'k') tx = tx.replace(d.hl, '<mark>$1</mark>');
      return `<div class="chat ${k === 'c' ? 'ctx' : ''}"><div class="who"><b>${esc(who)}</b>${esc(t)}${k === 'c' ? '<span class="lbl">이어진 대화</span>' : ''}</div><p>${tx.replace(/\n/g, '<br>')}</p></div>`;
    }).join('') : '<div class="chat"><p>관련 대화를 찾지 못했어요.</p></div>');
    $('#shBody').scrollTop = 0;
    sheet.classList.add('open'); bg.classList.add('open'); document.body.style.overflow = 'hidden';
  }
  const closeSheet = () => { sheet.classList.remove('open'); bg.classList.remove('open'); document.body.style.overflow = ''; };
  bg.onclick = closeSheet; $('#shClose').onclick = closeSheet;
  addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  document.addEventListener('click', e => { const t = e.target.closest('[data-sheet]'); if (t) openSheet(+t.dataset.sheet); });
  const zoneSheet = (z, cat) => { const p = W.picks.find(x => x.zone === z) || W.rising.find(x => x.zone === z) || W.issues.find(x => x.zone === z); return reg({ cat, title: z + ' 관련 대화', rows: p ? p.chats : [], label: '이번 주 ' + z, hl: zoneRe(z) }); };

  /* ---------- 화면 ---------- */
  let html = '';
  // 주차 배너
  html += `<div class="banner"><h1>${esc(W.weekLabel)} 기준</h1><p>${esc(W.range)} · 대화 ${W.messages.toLocaleString()}개 ${W.live ? `<span class="live"><i></i>업데이트 중 · ${esc(W.latest)}까지</span>` : ''}</p></div>`;

  // 이번 주 한 줄
  const H = W.headline, NH = N.headline || {};
  if (H) {
    const why = NH.why || H.evidence.map(([n, x]) => [n, `“${x}”`]);
    html += `<div class="headline">
      <h2>${esc(NH.title || `이번 주 톡방, ${H.zone} 추천이 제일 많았어요 👀`)}</h2>
      <p>${esc(NH.lead || `${H.people}명이 ${H.zone}을(를) 추천했어요.`)}</p>
      <ul class="why">${why.map(([b, t]) => `<li><b>${esc(b)}</b> ${esc(t)}</li>`).join('')}</ul>
      <button class="more" data-sheet="${zoneSheet(H.zone, '📍 추천 구역')}">${esc(H.zone)} 추천 근거 전체 보기 ›</button>
    </div>`;
  }

  // 주요 언급 이슈
  const NI = N.issues || {};
  html += `<section id="issue"><div class="sh"><h2>주요 언급 이슈 🔥</h2><small>지난주 대비</small></div>`;
  if (W.issues.length) {
    html += `<div class="slider" id="slider">` + W.issues.map(c => {
      const n = NI[c.key] || {};
      const id = reg({ cat: c.cat, title: n.title || c.title, rows: c.chats, label: c.zone ? '이번 주 ' + c.zone : '', hl: c.zone ? zoneRe(c.zone) : null });
      return `<button class="card" data-sheet="${id}"><span class="cat">${esc(c.cat)}</span><h3>${esc(n.title || c.title)}</h3><p>${esc(n.summary || c.summary)}</p>
        <span class="foot">${c.people}명이 얘기했어요${c.trendText ? ` · <em class="${c.trend}">${esc(c.trendText)}</em>` : ''}</span></button>`;
    }).join('') + `</div><div class="dots" id="dots">${W.issues.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>`;
  } else html += `<p class="empty">이번 주 눈에 띄는 이슈가 없어요.</p>`;

  // 갑자기 많이 언급된 구역
  const NR = N.rising || {};
  html += `<div class="sub">갑자기 많이 언급된 구역 🚀</div>`;
  if (W.rising.length) {
    html += `<div class="slider">` + W.rising.map(r => `<button class="card zcard" data-sheet="${zoneSheet(r.zone, '🚀 갑자기 많이 언급된 구역')}">
      <span class="zhead"><b>${esc(r.zone)}</b><span class="zx ${r.ratio == null ? 'new' : ''}">${r.ratio == null ? '새로 등장' : `평소의 ${r.ratio}배`}</span></span>
      <p>${esc(NR[r.zone] || (r.comment ? `“${r.comment}”` : ''))}</p><span class="foot">이번 주 ${r.count}회 언급</span></button>`).join('') + `</div>`;
    html += `<p class="basis">* 평소 = 직전 4주 동안의 주당 평균 언급 수</p>`;
  } else html += `<p class="empty">평소보다 크게 늘어난 구역은 없어요.</p>`;
  html += `</section>`;

  // 주요 추천 구역
  const rtz = new Set(W.retree.zones || []);
  html += `<section id="pick"><div class="sh"><h2>주요 추천 구역 📍</h2><small>추천한 사람 수 순</small></div>`;
  html += W.picks.length ? W.picks.map((p, i) => {
    const mv = p.isNew ? '<span class="mv new">NEW</span>' : p.move > 0 ? `<span class="mv up">▲${p.move}</span>` : p.move < 0 ? `<span class="mv down">▼${-p.move}</span>` : '<span class="mv">–</span>';
    return `<div class="r" data-sheet="${zoneSheet(p.zone, '📍 추천 구역')}"><span class="no">${i + 1}</span><span><span class="zn ${p.isNew ? 'dot' : ''}">${esc(p.zone)}</span>${rtz.has(p.zone) ? '<span class="rt">리트리</span>' : ''}<span class="m">추천 ${p.people}명 · 언급 ${p.mentions}회</span></span>${mv}</div>`;
  }).join('') : `<p class="empty">이번 주 추천으로 잡힌 구역이 없어요.</p>`;
  html += `<p class="basis">* “추천·한 표·좋게 봅니다·지켜보시길”처럼 직접 권하는 말만 추천으로 세요. 질문이나 “취소·무산·비싸·ㅠ”가 섞인 말은 빼요.<br>* 부정적인 소식이 많은 구역은 순위에서 빼고 주요 이슈로 옮겨요${W.negZones.length ? ` (이번 주: ${esc(W.negZones.join(', '))})` : ''}</p></section>`;

  // 리트리
  const NT = N.retree || {};
  const pickCard = (p, tag) => `<div class="pick"><h3>${esc(NT[p.title] || p.title)}${tag ? '<span class="wk-tag">이번 주</span>' : ''}</h3><p>“${esc(p.quote)}”</p><div class="meta"><b>${p.via === 'cite' ? esc(p.by) + '님 인용' : '리트리 픽'}</b>${esc(p.date)}</div></div>`;
  const wkTitles = new Set(W.retree.week.map(p => p.title));
  html += `<section id="retree"><div class="sh"><h2>리트리 추천 구역 ⭐</h2></div>
    <div class="seg" id="rtSeg"><button class="on" data-p="rtWeek">이번 주 <em>${W.retree.week.length}</em></button><button data-p="rtPast">지난 4주 <em>${W.retree.past.length}</em></button></div>
    <div id="rtWeek">${W.retree.week.length ? W.retree.week.map(p => pickCard(p, false)).join('') : '<p class="empty">이번 주엔 리트리 추천이 없었어요. 지난 4주 탭에서 최근 추천을 볼 수 있어요.</p>'}</div>
    <div id="rtPast" hidden>${W.retree.past.length ? W.retree.past.map(p => pickCard(p, wkTitles.has(p.title))).join('') : '<p class="empty">지난 4주 동안 잡힌 추천이 없어요.</p>'}</div>
    <div class="sub">리트리의 이번 주 한마디 💬</div>
    ${W.retree.talk.length ? W.retree.talk.map(t => `<div class="post"><ul class="talk">${(t.lines || [t.text]).map(l => `<li>${esc(l)}</li>`).join('')}</ul>${t.more ? `<div class="meta">…외 ${t.more}개</div>` : ''}<div class="meta">${esc(t.date)} · 연속 발언 ${t.count}개</div></div>`).join('') : '<p class="empty">이번 주 리트리 발언이 없어요.</p>'}
  </section>`;

  // 장미마을
  const R = W.rose, NRo = N.rose || R.top.map(([n, x]) => [n, `“${x}”`]);
  html += `<section id="rose"><div class="sh"><h2>장미마을 언급 🌹</h2><small>신길·도림 장미마을</small></div>
    <div class="rose-stat"><div><b>${R.week}회</b><span>이번 주 언급</span></div><div><b>${R.month}회</b><span>${esc(W.monthLabel)} 전체</span></div><div><b>${R.prev}회</b><span>지난주 언급</span></div></div>
    ${NRo.length ? `<ul class="why">${NRo.map(([b, t]) => `<li><b>${esc(b)}</b> ${esc(t)}</li>`).join('')}</ul>` : '<p class="empty">이번 주 장미마을 얘기가 없었어요.</p>'}
    <button class="more" data-sheet="${reg({ cat: '🌹 장미마을', title: '장미마을 관련 대화', rows: R.chatsWeek, label: '이번 주 장미마을', hl: ROSE_RE })}">이번 주 장미마을 대화 전체 보기 ›</button><br>
    <button class="more sub-more" data-sheet="${reg({ cat: '🌹 장미마을', title: '장미마을 ' + W.monthLabel + ' 대화 전체', rows: R.chatsMonth, label: W.monthLabel + ' 장미마을', hl: ROSE_RE })}">${esc(W.monthLabel)} 대화 전체 보기 ›</button>
    <p class="basis">* 잠실장미·하계장미·장미상가 이야기는 빼고 모았어요</p></section>`;

  main.innerHTML = html;
  $('#built').textContent = `업데이트 ${W.built}`;

  /* ---------- 동작 ---------- */
  // 탭 주황 점: 이번 주 새 내용
  const tabs = [...document.querySelectorAll('#tabs a')];
  if (W.picks.some(p => p.isNew)) tabs[1].classList.add('dot');
  if (W.retree.week.length) tabs[2].classList.add('dot');
  if (R.week) tabs[3].classList.add('dot');
  addEventListener('scroll', () => {
    let cur = tabs[0];
    for (const t of tabs) { const s = document.querySelector(t.getAttribute('href')); if (s && s.getBoundingClientRect().top < 140) cur = t; }
    tabs.forEach(t => t.classList.toggle('on', t === cur));
  }, { passive: true });
  // 이슈 슬라이드 점
  const slider = $('#slider'), dots = [...document.querySelectorAll('#dots i')];
  if (slider) slider.addEventListener('scroll', () => {
    const cards = [...slider.children]; let k = 0;
    cards.forEach((c, i) => { if (Math.abs(c.offsetLeft - slider.offsetLeft - 20 - slider.scrollLeft) < Math.abs(cards[k].offsetLeft - slider.offsetLeft - 20 - slider.scrollLeft)) k = i; });
    dots.forEach((d, i) => d.classList.toggle('on', i === k));
  }, { passive: true });
  // 리트리 탭
  document.querySelectorAll('#rtSeg button').forEach(b => b.onclick = () => {
    document.querySelectorAll('#rtSeg button').forEach(x => { x.classList.toggle('on', x === b); $('#' + x.dataset.p).hidden = x !== b; });
  });
})();
</script>
</body>
</html>
